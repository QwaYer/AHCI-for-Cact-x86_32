# Meson cross file for a Cact kernel module (i386, ring 0, freestanding).
#
#   meson setup build-meson --cross-file cross/i686-cact-clang.ini
#
# The module is a relocatable object loaded by the kernel, so clang only needs
# 32-bit mode; system = 'none' keeps Meson from assuming a hosted C library.

[binaries]
c = 'clang'
ar = 'ar'
strip = 'strip'
objcopy = 'objcopy'

[built-in options]
c_args = ['-m32']

[host_machine]
system = 'none'
cpu_family = 'x86'
cpu = 'i686'
endian = 'little'
